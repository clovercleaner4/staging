ype":"Answer","text":"ご安心ください。Clover cleanerでは、頑固な油汚れまでしっかり落とすために専用洗剤を使用しておりますが、同時に「残さない清掃」を大切にしています。汚れを落とした後の「すすぎ」と「水拭き」を徹底し、洗剤成分やニオイが残らない状態に仕上げておりますので、ペットや小さなお子様がいるご家庭でも安心してお使いいただけます。"}},{"@type":"Question","name":"古いエアコンでもクリーニングできますか？","acceptedAnswer":{"@type":"Answer","text":"はい、可能です。ただし、製造から10年以上経過している機種については、プラスチック部品の劣化による破損リスクがあるため、補償の対象外となる場合がございます。事前にメーカーと型番をお知らせいただければ確認いたします。"}},{"@type":"Question","name":"雨の日でも作業は可能ですか？","acceptedAnswer":{"@type":"Answer","text":"はい、室内機・室外機ともに雨天でも作業可能です。ただし、屋根のない場所での室外機洗浄など、安全確保が難しい暴風雨の場合は日程変更をご相談させていただくことがございます。"}},{"@type":"Question","name":"駐車スペースがない場合はどうなりますか？","acceptedAnswer":{"@type":"Answer","text":"お客様宅に駐車スペースがない場合、近隣のコインパーキングを利用させていただきます。その際、駐車料金の実費のみお客様にご負担をお願いしております。"}},{"@type":"Question","name":"女性スタッフに来てもらうことはできますか？","acceptedAnswer":{"@type":"Answer","text":"はい、可能です。当店は夫婦で活動しており、女性スタッフの同行をご希望の際は、ご予約時にお気軽にお申し付けください。一人暮らしの女性のお客様も安心してご利用いただけます。"}},{"@type":"Question","name":"支払い方法は何がありますか？","acceptedAnswer":{"@type":"Answer","text":"作業完了後に「現金」または「PayPay」でお支払いいただけます。法人のお客様につきましては、請求書払い（銀行振込）も対応可能ですのでご相談ください。"}},{"@type":"Question","name":"キャンセルした場合、料金はかかりますか？","acceptedAnswer":{"@type":"Answer","text":"作業前日17時までのご連絡であれば、キャンセル料は一切かかりません。それ以降のキャンセルにつきましては、規定のキャンセル料をいただく場合がございます。"}}]}</script><div style="font-family:system-ui,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif,&quot;Apple Color Emoji&quot;,&quot;Segoe UI Emoji&quot;;height:100vh;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center"><div><style>body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}</style><h1 class="next-error-h1" style="display:inline-block;margin:0 20px 0 0;padding:0 23px 0 0;font-size:24px;font-weight:500;vertical-align:top;line-height:49px">404</h1><div style="display:inline-block"><h2 style="font-size:14px;font-weigh
